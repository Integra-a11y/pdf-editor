<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Éditeur PDF</title>
<link href="./fonts/fonts.css" rel="stylesheet">
<style>
/* VOICE: Apple-grade tool: calm, precise, joyful colour used with intent
   IDEA: a sheet of paper resting on a softly lit, colourful desk, with glass instruments floating over it
   PICTURE: the open page centred on a pastel aurora, translucent glass toolbars, colour-coded tool tiles
   COLOUR and TYPE: system blue as action colour, one system tint per tool, frosted glass materials; SF Pro on Apple devices, Inter elsewhere
   LAYOUT: glass app bar / sidebar | desk with floating palette and page pill | inset-grouped inspector; drawer on tablets, bottom tool bar on phones */
:root{color-scheme:light dark;
--font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",Inter,"Segoe UI",system-ui,sans-serif;
--blue:#007aff;--green:#34c759;--red:#ff3b30;--orange:#ff9500;--yellow:#ffcc00;--pink:#ff2d55;--purple:#af52de;--indigo:#5856d6;--teal:#30b0c7;
--ink:light-dark(#1d1d1f,#f5f5f7);--mute:light-dark(#6e6e73,#a1a1a6);--line:light-dark(#0000001a,#ffffff1f);
--mat:light-dark(#ffffffb8,#1e1e22b8);--matStrong:light-dark(#ffffffe0,#1c1c1fe6);--card:light-dark(#ffffff,#2c2c2e);--fill:light-dark(#7676801f,#7676803d);--hov:light-dark(#00000012,#ffffff1f);
--selBg:light-dark(#007aff1a,#0a84ff33);--sel:light-dark(#007aff,#0a84ff);
--g1:light-dark(#cfe3ff,#1b2a55);--g2:light-dark(#ffd6ea,#4a1d3a);--g3:light-dark(#d4f7e8,#123d33);--g4:light-dark(#fff0c9,#3f3212);--base:light-dark(#eef0f6,#0b0c10);
--blur:saturate(180%) blur(22px);
--sh1:0 1px 2px #0000000f,0 0 0 .5px #0000000d;
--sh2:0 8px 30px light-dark(#0000001f,#0000008c),0 0 0 .5px light-dark(#0000000f,#ffffff14);
--sh3:0 24px 70px light-dark(#00000033,#000000b3),0 0 0 .5px light-dark(#0000000f,#ffffff1a)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;color:var(--ink);font:14px/1.42 var(--font);letter-spacing:-.005em;overflow:hidden;display:grid;grid-template-rows:auto minmax(0,1fr);-webkit-font-smoothing:antialiased;
  background:radial-gradient(60% 55% at 8% 0%,var(--g1),transparent 70%),radial-gradient(50% 50% at 100% 8%,var(--g2),transparent 70%),radial-gradient(55% 60% at 85% 100%,var(--g3),transparent 70%),radial-gradient(50% 50% at 0% 100%,var(--g4),transparent 70%),var(--base);background-attachment:fixed}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
svg{flex:none}
.glass{background:var(--mat);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}

/* ---------- App bar ---------- */
.bar{position:relative;display:flex;align-items:center;gap:6px;padding:8px 12px;background:var(--mat);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border-bottom:.5px solid var(--line);z-index:7;min-height:58px}
.brand{display:flex;align-items:center;gap:10px;margin-right:8px;min-width:0}
.logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(145deg,#5ac8fa,#007aff 45%,#5856d6);display:grid;place-items:center;flex:none;box-shadow:0 4px 12px #007aff59,inset 0 1px 0 #ffffff59}
.logo svg{width:22px;height:22px}
.titles{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.titles h1{font-size:13.5px;font-weight:650;margin:0;white-space:nowrap;letter-spacing:-.01em}
.docname{font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
.grp{display:flex;gap:2px;align-items:center}
.sep{width:.5px;height:22px;background:var(--line);margin:0 6px;flex:none}
.sp{flex:1}
.btn{--tint:var(--blue);position:relative;display:inline-flex;align-items:center;gap:7px;min-height:38px;min-width:38px;padding:0 11px;border:0;border-radius:10px;background:transparent;cursor:pointer;white-space:nowrap;justify-content:center;transition:background .15s,color .15s,transform .12s,box-shadow .15s}
.btn:hover{background:var(--hov)}
.btn:active{transform:scale(.96)}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #007aff59;outline-offset:1px}
.btn[aria-pressed=true]{background:linear-gradient(180deg,color-mix(in srgb,var(--tint) 82%,white),var(--tint));color:#fff;box-shadow:0 4px 12px color-mix(in srgb,var(--tint) 45%,transparent),inset 0 1px 0 #ffffff40}
.btn.main{background:linear-gradient(180deg,#2d8cff,#007aff);color:#fff;font-weight:600;padding:0 16px;box-shadow:0 2px 8px #007aff52,inset 0 1px 0 #ffffff40}
.btn.main:hover{background:linear-gradient(180deg,#4a9cff,#0a84ff)}
.btn.ghost{background:var(--card);box-shadow:var(--sh1);font-weight:550}
.btn.ghost:hover{background:var(--card);box-shadow:0 2px 8px #0000001a,0 0 0 .5px #0000001a}
.btn:disabled{opacity:.32;cursor:default;background:transparent;transform:none}.btn.main:disabled{background:linear-gradient(180deg,#2d8cff,#007aff)}
.btn svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.lbl{font-size:13.5px;font-weight:550}
.search{display:flex;align-items:center;gap:6px;height:36px;padding:0 4px 0 11px;border-radius:10px;background:var(--fill);width:clamp(160px,22vw,300px);transition:background .15s,box-shadow .15s}
.search:focus-within{background:var(--card);box-shadow:0 0 0 3px #007aff40}
.search>svg{width:16px;height:16px;fill:none;stroke:var(--mute);stroke-width:2;stroke-linecap:round}
.search input{flex:1;border:0;background:none;height:34px;font-size:16px;outline:0;min-width:0}
.search input::placeholder{color:var(--mute)}
.search .btn{min-height:28px;min-width:28px;border-radius:8px;padding:0}.search .btn svg{width:15px;height:15px}
#bPanel[aria-pressed=true]{background:var(--fill);color:var(--ink);box-shadow:none}
.busy{position:absolute;left:0;right:0;bottom:-1px;height:2px;overflow:hidden;opacity:0;transition:opacity .2s}
.busy.on{opacity:1}.busy::after{content:"";position:absolute;inset:0;width:35%;border-radius:2px;background:linear-gradient(90deg,#5ac8fa,#007aff,#af52de);animation:busy 1.1s ease-in-out infinite}
@keyframes busy{from{transform:translateX(-100%)}to{transform:translateX(300%)}}

/* ---------- Frame ---------- */
.app{--sideW:188px;--panelW:318px;display:grid;grid-template-columns:54px var(--sideW) minmax(0,1fr) var(--panelW);min-height:0;position:relative;transition:grid-template-columns .22s cubic-bezier(.2,.8,.2,1)}
.app.noside{--sideW:0px}.app.nopanel{--panelW:0px}
.navstrip{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 0;background:var(--mat);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border-right:.5px solid var(--line)}
.navstrip .btn{min-width:38px;padding:0}
.navstrip .btn[aria-pressed=true]{background:var(--selBg);color:var(--sel);box-shadow:none}
.side{overflow-y:auto;overflow-x:hidden;background:var(--mat);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border-right:.5px solid var(--line)}
.app.noside .side{border:0}
.paneh{position:sticky;top:0;z-index:2;padding:14px 16px 8px;font-size:12px;font-weight:650;color:var(--mute);display:flex;justify-content:space-between;align-items:center;letter-spacing:.01em}
.paneh small{font-weight:500}
#thumbs{display:flex;flex-direction:column;gap:12px;padding:2px 14px 20px}
.th{border:0;border-radius:14px;padding:10px 8px 8px;cursor:pointer;background:none;text-align:center;transition:background .15s}
.th:hover{background:var(--hov)}
.th .thc{position:relative;margin:0 auto;width:fit-content;box-shadow:0 2px 8px #0000001f,0 0 0 .5px #0000001a;background:#fff;border-radius:4px;overflow:hidden;transition:box-shadow .15s}
.th canvas{display:block;max-width:100%}.th canvas.tov{position:absolute;inset:0;width:100%;height:100%}
.th span{display:inline-block;font-size:11.5px;font-weight:600;color:var(--mute);margin-top:7px;padding:1px 9px;border-radius:999px;font-variant-numeric:tabular-nums}
.th.cur span{background:var(--blue);color:#fff}
.th.cur .thc{box-shadow:0 0 0 3px var(--sel),0 6px 18px #007aff40}
.th.msel{background:var(--selBg)}.th.dropT{box-shadow:0 -3px 0 var(--sel)}
#outline{padding:0 8px 16px;font-size:13.5px}#outline ul{list-style:none;margin:0;padding-left:14px}#outline>ul{padding-left:0}
#outline button{display:block;width:100%;text-align:left;background:none;border:0;padding:7px 10px;border-radius:8px;cursor:pointer;color:var(--ink)}
#outline button:hover{background:var(--hov)}#outline button:disabled{color:var(--mute)}

/* ---------- Stage and desk ---------- */
.stage{position:relative;min-height:0;display:grid}
.desk{overflow:auto;position:relative;padding:30px 96px 124px}
.pg{position:relative;margin:0 auto 30px;background:#fff;border-radius:3px;box-shadow:0 0 0 .5px #0000001a,0 2px 6px #0000000f,0 18px 50px light-dark(#1d1d1f24,#00000099)}
.pg canvas{position:absolute;inset:0;width:100%;height:100%}
.desk[data-tool=read] .ov{pointer-events:none}
.desk:not([data-tool=read]) .ov{touch-action:none;cursor:crosshair}
.desk[data-tool=select] .ov{cursor:default}
.desk[data-tool=text] .ov,.desk[data-tool=edit] .ov{cursor:text}.desk[data-tool=erase] .ov{cursor:not-allowed}.desk[data-tool=note] .ov{cursor:copy}
.pg textarea.tx{position:absolute;z-index:4;box-sizing:content-box;border:1.5px solid var(--blue);border-radius:2px;outline:0;background:#ffffff99;padding:0;margin:-1.5px 0 0 -1.5px;resize:horizontal;overflow:hidden;white-space:pre-wrap;overflow-wrap:anywhere;min-width:24px;box-shadow:0 0 0 4px #007aff26}
.pg textarea.tx.auto{white-space:pre;resize:none;overflow-wrap:normal}
.note{font-size:12.5px;color:var(--mute);text-align:center;margin:-10px auto 16px;max-width:62ch}
.note:empty{display:none}

/* Floating glass tool palette */
.rail{position:absolute;left:18px;top:18px;z-index:5;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px;background:var(--matStrong);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border-radius:20px;box-shadow:var(--sh2);max-height:calc(100% - 36px);overflow-y:auto;scrollbar-width:none}
.rail hr{width:22px;border:0;border-top:.5px solid var(--line);margin:5px 0}
.rail .btn{min-width:42px;min-height:42px;padding:0;border-radius:12px;color:var(--tint)}
.rail .btn[aria-pressed=true]{color:#fff}
.rail .btn svg{width:21px;height:21px;stroke-width:1.8}

/* Tooltips */
[data-tip]:hover::after,[data-tip]:focus-visible::after{content:attr(data-tip);position:absolute;z-index:30;pointer-events:none;white-space:nowrap;background:light-dark(#1d1d1fe6,#f5f5f7f0);color:light-dark(#fff,#1d1d1f);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);font-size:12px;font-weight:550;padding:6px 10px;border-radius:8px;box-shadow:0 6px 20px #00000033;animation:tip .14s .35s both;letter-spacing:0}
.rail [data-tip]:hover::after,.rail [data-tip]:focus-visible::after,.tipright [data-tip]:hover::after,.tipright [data-tip]:focus-visible::after{left:calc(100% + 12px);top:50%;translate:0 -50%}
.tipup [data-tip]:hover::after,.tipup [data-tip]:focus-visible::after{bottom:calc(100% + 10px);left:50%;translate:-50% 0}
.tipdown [data-tip]:hover::after,.tipdown [data-tip]:focus-visible::after{top:calc(100% + 8px);left:50%;translate:-50% 0}
@keyframes tip{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}

/* Page and zoom pill */
.navpill{position:absolute;left:50%;bottom:20px;translate:-50% 0;z-index:5;display:flex;align-items:center;gap:2px;padding:5px;background:var(--matStrong);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border-radius:999px;box-shadow:var(--sh2)}
.navpill .btn{min-width:34px;min-height:34px;padding:0;border-radius:999px}.navpill .btn svg{width:17px;height:17px}
.pgbox{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mute);padding:0 4px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pgbox input{width:42px;height:28px;text-align:center;border:0;border-radius:8px;background:var(--fill);color:var(--ink);font-size:14px;font-weight:650}
.vsep{width:.5px;height:18px;background:var(--line);margin:0 5px}
.zv{font-size:12.5px;font-weight:650;font-variant-numeric:tabular-nums;min-width:56px!important}

/* Contextual HUD over the selection */
.ctx{position:absolute;z-index:6;display:none;align-items:center;gap:1px;padding:4px;background:#1d1d1fd9;-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);color:#fff;border-radius:13px;box-shadow:0 10px 30px #00000040,0 0 0 .5px #ffffff1f}
.ctx.on{display:flex;animation:pop .14s ease-out}
.ctx .btn{min-width:34px;min-height:34px;padding:0;border-radius:9px;color:#fff}.ctx .btn:hover{background:#ffffff26}
.ctx .btn svg{width:17px;height:17px}.ctx .vsep{background:#ffffff38}
.ctx [data-ctx=delObj]{color:#ff6961}
.ctx [data-tip]:hover::after{background:#f5f5f7;color:#1d1d1f}

/* Empty state */
.empty{position:absolute;inset:0;display:none;place-items:center;padding:24px;z-index:3}
.desk.none .empty{display:grid}
.desk.drag .empty{display:grid;background:#007aff12;outline:3px dashed #007aff80;outline-offset:-14px;border-radius:24px}
.desk.drag:not(.none) .ebox{display:none}
.ebox{max-width:520px;text-align:center;background:var(--matStrong);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border-radius:28px;padding:40px 34px 32px;box-shadow:var(--sh3)}
.eart{width:150px;margin:0 auto 18px;filter:drop-shadow(0 12px 24px #007aff33)}
.ebox h2{font-size:28px;line-height:1.1;margin:0 0 10px;text-wrap:balance;letter-spacing:-.02em;font-weight:700}
.ebox p{margin:0 0 22px;color:var(--mute);font-size:15px}
.ebox .row{justify-content:center;gap:10px}

/* Search sheet */
.hits{position:absolute;right:18px;top:14px;z-index:8;background:var(--matStrong);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border-radius:16px;padding:8px;max-height:min(70vh,520px);overflow:auto;box-shadow:var(--sh3);display:none;width:310px}
.hits.on{display:block;animation:pop .16s ease-out}.hits .btn{display:flex;justify-content:space-between;width:100%;gap:12px;min-height:36px}
.repl{display:flex;flex-direction:column;gap:6px;border-top:.5px solid var(--line);margin-top:6px;padding:10px 4px 2px}
.repl input[type=text]{height:36px;border:0;border-radius:10px;background:var(--fill);color:var(--ink);padding:0 11px;font-size:15px}

/* ---------- Inspector (inset grouped) ---------- */
.panel{overflow-y:auto;overflow-x:hidden;background:var(--mat);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border-left:.5px solid var(--line);display:flex;flex-direction:column;padding:10px 12px 16px;gap:12px}
.app.nopanel .panel{border:0;padding:0}
.panel section{padding:14px;background:var(--card);border-radius:16px;box-shadow:var(--sh1)}
.panel section:empty{display:none}
.panel h2{font-size:13px;font-weight:650;margin:0 0 10px;display:flex;justify-content:space-between;align-items:baseline;gap:8px;letter-spacing:-.01em}
.panel h2 small{font-weight:500;color:var(--mute);font-size:12px}
.layers{display:flex;flex-direction:column;gap:1px;max-height:34vh;overflow-y:auto;margin:0 -6px}
.lay{display:grid;grid-template-columns:32px minmax(0,1fr) 30px 30px;align-items:center;border-radius:10px;padding:0 4px}
.lay:hover{background:var(--hov)}
.lay.on{background:var(--selBg)}.lay .btn{min-height:32px;min-width:30px;padding:0;border-radius:8px}.lay .btn svg{width:16px;height:16px}
.lay .ti{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;color:#fff;background:linear-gradient(180deg,color-mix(in srgb,var(--tint) 78%,white),var(--tint));box-shadow:inset 0 1px 0 #ffffff40}
.lay .ti svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.lay .nm{justify-content:flex-start;overflow:hidden;font-size:13.5px;min-height:36px;padding:0 6px;font-weight:500}
.lay .nm span{overflow:hidden;text-overflow:ellipsis}
.lay.off .nm,.lay.off .ti{opacity:.4}
.lay .btn[aria-pressed]{background:transparent;color:var(--mute);box-shadow:none}.lay .btn[aria-pressed]:hover{color:var(--ink);background:var(--hov)}
.muted{color:var(--mute);font-size:12.5px;margin:0;line-height:1.45}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.f{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--mute);font-weight:550}
.f.full{grid-column:1/-1}
.f input:not([type=range]):not([type=color]):not([type=checkbox]),.f select,.f textarea{height:36px;border:0;border-radius:10px;background:var(--fill);color:var(--ink);padding:0 11px;font-size:15px;width:100%;font-weight:450;transition:box-shadow .15s,background .15s}
.f textarea{height:auto;padding:9px 11px;resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus{background:var(--card);box-shadow:0 0 0 3px #007aff4d;outline:0}
input[type=range]{width:100%;accent-color:var(--blue)}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.sw{width:24px;height:24px;border-radius:50%;border:0;box-shadow:inset 0 0 0 .5px #0000002e,0 1px 2px #0000001a;cursor:pointer;padding:0;transition:transform .12s}
.sw:hover{transform:scale(1.14)}
.sw[aria-pressed=true]{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--blue)}
input[type=color]{width:30px;height:28px;border:0;border-radius:8px;background:var(--fill);padding:2px;cursor:pointer}
.btn.seg{background:var(--fill)}.btn.seg[aria-pressed=true]{--tint:var(--orange)}
.notes{display:flex;flex-direction:column;gap:6px}.notes button{text-align:left;border:0;border-radius:12px;background:light-dark(#fff8db,#3a3215);padding:10px 12px;cursor:pointer;color:var(--ink);font-size:13.5px;box-shadow:inset 3px 0 0 var(--orange)}
.notes button:hover{filter:brightness(.98)}.notes small{color:var(--mute);display:block;font-size:11.5px}

/* Segmented action groups (arrange, page tools) */
.seg{display:grid!important;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:2px;background:var(--fill);border-radius:12px;padding:3px}
.seg .btn{min-height:36px;min-width:0;padding:0;border-radius:9px;color:var(--tint)}
.seg .btn:hover{background:var(--card);box-shadow:0 1px 3px #0000001a}
.seg .btn svg{width:18px;height:18px}

/* Organise view */
.org{position:absolute;inset:0;z-index:12;display:flex;flex-direction:column;background:var(--matStrong);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);animation:pop .18s ease-out}
.org[hidden]{display:none}
.orgbar{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:.5px solid var(--line);flex-wrap:wrap}
.orgbar h2{margin:0;font-size:17px;font-weight:700;letter-spacing:-.01em}
.orgacts{display:flex!important;width:auto}.orgacts .btn{min-width:38px}
#orgSize{width:120px}
.orggrid{flex:1;overflow:auto;padding:24px;display:grid;grid-template-columns:repeat(auto-fill,minmax(calc(var(--org) + 24px),1fr));gap:18px;align-content:start}
.oc{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 8px 8px;border-radius:16px;cursor:grab;transition:background .15s;outline:0}
.oc:hover{background:var(--hov)}.oc.on{background:var(--selBg)}
.ocw{position:relative;box-shadow:0 2px 10px #00000026,0 0 0 .5px #0000001a;background:#fff;border-radius:4px;overflow:hidden;transition:box-shadow .15s,transform .15s}
.oc.on .ocw{box-shadow:0 0 0 3px var(--sel),0 8px 24px #007aff40}
.ocw canvas{display:block}.ocw canvas.tov{position:absolute;inset:0;width:100%;height:100%}
.oc span{font-size:12px;font-weight:600;color:var(--mute);font-variant-numeric:tabular-nums}.oc.on span{color:var(--sel)}
.oc.dropL .ocw{box-shadow:-6px 0 0 -2px var(--sel),0 2px 10px #00000026}.oc.dropR .ocw{box-shadow:6px 0 0 -2px var(--sel),0 2px 10px #00000026}
/* Selection markup bar, links, editable outline */
.selbar .btn{padding:0 10px!important;font-size:13px;font-weight:550;gap:6px;min-width:0!important}
.links{position:absolute;inset:0;z-index:3;pointer-events:none}.links a{position:absolute;display:block;border-radius:2px}
.desk[data-tool=read] .links a{pointer-events:auto;cursor:pointer}.desk[data-tool=read] .links a:hover{background:#007aff1f;box-shadow:inset 0 0 0 1px #007aff66}
.oltools{padding:0 6px 8px}.oltools .btn{width:100%;justify-content:flex-start}
.ollist{display:flex;flex-direction:column;gap:1px}
.olrow{display:flex;align-items:center;border-radius:8px;padding-left:calc(var(--lvl) * 14px)}.olrow:hover{background:var(--hov)}
.olgo{flex:1;display:flex;justify-content:space-between;gap:6px;text-align:left;background:none;border:0;padding:7px 8px;cursor:pointer;color:var(--ink);font-size:13px;min-width:0}

    const a = +m[1], b = m[2] ? +m[2] : a; if (a < 1 || b > n || a > b) return null;
    parts.push(pages.slice(a - 1, b).map(p => p.id));
  }
  return parts.length ? parts : null;
}
async function splitParts(mode, val) {

  if (mode === 'ranges') return parseRanges(val, pages.length);
  const ol = (outlineEdit || await originalOutline()).filter(b => b.level === 0 && b.pageId);
  const starts = [...new Set(ol.map(b => pages.findIndex(p => p.id === b.pageId)).filter(k => k >= 0))].sort((a, b) => a - b);
  if (!starts.length) return null; if (starts[0] !== 0) starts.unshift(0);
  return starts.map((s, k) => pages.slice(s, starts[k + 1] ?? pages.length).map(p => p.id));
}

/* =================== Compare with another PDF (word-level text differences) =================== */
function diffWords(a, b) {
  const n = a.length, m = b.length, max = CONFIG.compare.maxWordsPerPage;

  while (i < n && j < m) { if (a[i] === b[j]) { ops.push(['=', a[i]]); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) ops.push(['-', a[i++]]); else ops.push(['+', b[j++]]); }
  while (i < n) ops.push(['-', a[i++]]); while (j < m) ops.push(['+', b[j++]]);
  return ops;
}

$('thumbs').addEventListener('contextmenu', e => { const b = e.target.closest('.th'); if (!b) return; e.preventDefault(); selectForMenu(+b.dataset.i); openMenu(e.clientX, e.clientY, pageMenuItems()); });

/* =================== Interface language =================== */
async function setUiLang(code) {

  try { if (pages.length && !isSample && feat('autosave')) { await writeDraft(); sessionStorage.setItem(CONFIG.langSwitchKey, '1'); } } catch {}
  location.reload();

/* =================== Inputs and shortcuts =================== */
const setTool = t => { closeEditor(true); prefs.tool = t; prefs.color = null; savePrefs(); syncChrome(); pages.forEach((_, i) => drawOverlay(i)); renderProps(); };
$('rail').addEventListener('click', e => { const b = e.target.closest('[data-tool]'); if (b) setTool(b.dataset.tool); });
$('bOpen').onclick = () => $('fOpen').click(); $('bAdd').onclick = () => $('fAdd').click();
$('bImg').onclick = () => $('fImg').click();
$('fOpen').onchange = e => { if (e.target.files.length) openFiles([e.target.files[0]], true); e.target.value = ''; };

$('bUndo').onclick = undo; $('bRedo').onclick = redo;
$('bAll').onclick = openAllTools;
$('rail').addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (!b) return; const a = b.dataset.act; if (a === 'all') return openAllTools(); if (!pages.length) return; ({ sign: openSign, stamp: openStamps, img: () => $('fImg').click(), organize: openOrganizer })[a]?.(); });
$('bSettings').onclick = openSettings;
let wheelT = 0;
$('desk').addEventListener('wheel', e => {

  setZoom(prefs.zoom * (e.deltaY < 0 ? CONFIG.zoom.step : 1 / CONFIG.zoom.step));

$('bPanel').onclick = () => $('panel').classList.toggle('open');
const desk = $('desk');
desk.addEventListener('dragover', e => { if (dragPage != null) return; e.preventDefault(); desk.classList.add('drag'); });

desk.addEventListener('drop', async e => {
  if (dragPage != null) return; e.preventDefault(); desk.classList.remove('drag');
  const all = [...e.dataTransfer.files], pdfs = all.filter(f => /pdf$/i.test(f.type) || /\.pdf$/i.test(f.name)), imgs = all.filter(f => /^image\//.test(f.type));
  if (pdfs.length) await openFiles(pdfs, !pages.length || isSample);
  if (imgs.length && pages.length) { const el = e.target.closest('.pg'); if (el) { const i = +el.dataset.i; setCur(i); await insertImages(imgs, i, evPt(e, el)); } else await insertImages(imgs); }
});
document.addEventListener('paste', e => {
  if (e.target.matches?.('input, textarea')) return;
  const files = [...(e.clipboardData?.files || [])].filter(f => /^image\//.test(f.type));
  if (files.length && pages.length) { e.preventDefault(); insertImages(files); }
  else if (clip && pages.length) { e.preventDefault(); pasteObj(); }
});
document.addEventListener('keydown', e => {
  if (e.target.matches('input, textarea, select') || anyDialog()) return;
  const k = e.key.toLowerCase(), mod = e.ctrlKey || e.metaKey, o = selObj();
  if (mod && k === 'c' && o && !String(getSelection())) { clip = JSON.stringify(o); toast(T.copied); }
  else if (mod && k === 'f') { e.preventDefault(); openFind(); }
  else if (mod && k === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); }
  else if (mod && k === 'y') { e.preventDefault(); redo(); }
  else if (mod && k === 's') { e.preventDefault(); $('bSave').click(); }
  else if (mod && k === 'd') { e.preventDefault(); if (o) arrange('dup'); }
  else if ((k === 'delete' || k === 'backspace') && o) { e.preventDefault(); arrange('delObj'); }
  else if (k === 'escape') select(null);
  else if (o && !o.locked && k.startsWith('arrow')) {
    e.preventDefault(); const vp = vp1For(sel.i); if (!vp) return;
    const d = e.shiftKey ? CONFIG.select.nudgeBigPt : CONFIG.select.nudgePt, fv = frame(o, vp).fv, b = box(o, fv);
    const [dx, dy] = frameDelta(o, vp, ...{ arrowleft: [-d, 0], arrowright: [d, 0], arrowup: [0, -d], arrowdown: [0, d] }[k]);
    snap(); setBox(o, fv, [b[0] + dx, b[1] + dy, b[2] + dx, b[3] + dy], b); changed(sel.i); updateGeomFields();
  }

  else if (k === 'pageup') { e.preventDefault(); goTo(cur - 1); }

  else if (!mod && k === 'i' && pages.length && feat('img')) $('fImg').click();

let resizeT; window.addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(() => pages.forEach((_, i) => { const el = pgEl(i); if (el) el._key = null; }), 200); });

/* =================== Sample document (the tool opens mid-use) =================== */
async function sampleStamp() {
  const S = CONFIG.sample, [W, H] = S.stampPx, c = document.createElement('canvas'), x = c.getContext('2d');
  c.width = W; c.height = H; x.strokeStyle = x.fillStyle = S.stampColor; x.lineWidth = 8;
  x.beginPath(); x.roundRect(6, 6, W - 12, H - 12, 18); x.stroke();
  x.font = `bold ${Math.round(H * 0.42)}px ${CONFIG.fonts.helv.css}`; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(T.sampleStamp, W / 2, H / 2 + 2);
  const blob = await new Promise(r => c.toBlob(r, 'image/png'));
  return new File([blob], T.sampleStamp + '.png', { type: 'image/png' });
}
async function loadSample() {

  p1.drawText(T.sampleTitle, { x: S.margin, y, size: S.titleSize, font: fb });
  y -= S.titleSize * 1.6;
  for (const line of T.sampleBody) { p1.drawText(line, { x: S.margin, y, size: S.bodySize, font: f }); y -= S.lineGap; }
  const p2 = doc.addPage([S.width, S.height]);

  hl.name = autoName(hl); pages[0].objs.push(hl);
  const stampId = await loadImage(await sampleStamp()), im = images.get(stampId), sw = S.stampPt, sh = sw * im.h / im.w;
  const arrow = { id: newId(), type: 'shape', kind: 'arrow', stroke: true, strokeColor: S.stampColor, strokeWidth: 2, fill: false, fillColor: prefs.fillColor, opacity: 1, pts: [[S.width - S.margin - sw - 70, S.height - S.margin - sh - 40], [S.width - S.margin - sw - 8, S.height - S.margin - sh / 2]] };
  arrow.name = autoName(arrow); pages[0].objs.push(arrow);
